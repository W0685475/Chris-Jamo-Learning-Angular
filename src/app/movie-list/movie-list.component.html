<div *ngFor="let movie of movieList">
  <h2>{{movie.title}} {{movie.releaseYear}})</h2>
  <p>{{movie.director}} - {{movie.genre}} - Rating: {{movie.rating}}</p>
  <img [src]="movie.image" alt="{{movie.title}} image" width="100" height="150">

  <button (click)="delete(movie.id)">Delete</button>
  <button (click)="navigateToMovieList()">Edit Movie</button>
</div>
