<div *ngFor="let movie of movieList">
  <p>{{movie.id}}</p>
  <p>{{movie.title}}</p>
  <button type="button" (click)="delete(movie.id)">Delete</button>
  <button type="button" (click)="navigateToMovieList()">Back to List</button>
</div>
