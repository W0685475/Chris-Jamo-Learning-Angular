<!-- modify-student.component.html -->
<form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- First Name Field -->
  <div class="form-group">
    <label for="movieName">Movie Name</label>
    <input type="text" id="movieName" formControlName="movieName" />
  </div>

  <!-- Last Name Field -->
  <div class="form-group">
    <label for="directorName">Director Name</label>
    <input type="text" id="directorName" formControlName="directorName" />
  </div>

  <!-- Department Field -->
  <div class="form-group">
    <label for="filmCompany">Film Company</label>
    <input type="text" id="filmCompany" formControlName="filmCompany" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="goodFilm">Good Film</label>
    <input type="checkbox" id="goodFilm" formControlName="goodFilm" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>
</form>
