<form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- Title Field -->
  <div class="form-group">
    <label for="title">Title</label>
    <input type="text" id="title" formControlName="title" />
  </div>

  <!-- Director Field -->
  <div class="form-group">
    <label for="director">Director</label>
    <input type="text" id="director" formControlName="director" />
  </div>

  <!-- Release Year Field -->
  <div class="form-group">
    <label for="releaseYear">Release Year</label>
    <input type="number" id="releaseYear" formControlName="releaseYear" />
  </div>

  <!-- Genre Field -->
  <div class="form-group">
    <label for="genre">Genre</label>
    <input type="text" id="genre" formControlName="genre" />
  </div>

  <!-- Rating Field -->
  <div class="form-group">
    <label for="rating">Rating</label>
    <input type="number" id="rating" formControlName="rating" min="0" max="10" step="0.1" />
  </div>

  <!-- Image Field -->
  <div class="form-group">
    <label for="image">Image URL</label>
    <input type="text" id="image" formControlName="image" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <div class="button-group">
    <button type="submit">Submit</button>
    <button type="button" (click)="navigateToMovieList()">Back To List</button>
  </div>
</form>
