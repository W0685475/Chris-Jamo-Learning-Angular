<form [formGroup]="movieForm" (ngSubmit)="onSubmit()" class="mat-form dark-theme">
  <!-- ID Field -->
  <div class="form-container">
    <mat-form-field color="primary" appearance="outline" class="form-field">
      <mat-label>ID</mat-label>
      <input matInput type="number" formControlName="id" />
    </mat-form-field>
  </div>

  <!-- Title Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Title</mat-label>
      <input matInput type="text" formControlName="title" />
    </mat-form-field>
  </div>

  <!-- Director Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Director</mat-label>
      <input matInput type="text" formControlName="director" />
    </mat-form-field>
  </div>

  <!-- Release Year Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Release Year</mat-label>
      <input matInput type="number" formControlName="releaseYear" />
    </mat-form-field>
  </div>

  <!-- Genre Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Genre</mat-label>
      <input matInput type="text" formControlName="genre" />
    </mat-form-field>
  </div>

  <!-- Rating Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Rating</mat-label>
      <input matInput type="number" formControlName="rating" min="0" max="10" step="0.1" />
    </mat-form-field>
  </div>

  <!-- Price Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" min="0" step="0.1" />
    </mat-form-field>
  </div>

  <!-- Image URL Field -->
  <div class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Image URL</mat-label>
      <input matInput type="text" formControlName="image" />
    </mat-form-field>
  </div>

  <!-- Buttons -->
  <div class="button-group">
    <button mat-raised-button color="primary" type="submit">Submit</button>
    <button mat-raised-button color="warn" type="button" (click)="onDelete()">Delete</button>
    <button mat-button type="button" (click)="navigateToMovieList()">Back To List</button>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="error mat-error">{{ error }}</div>
</form>
