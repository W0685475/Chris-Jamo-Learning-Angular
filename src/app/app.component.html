<!-- Navigation Bar -->
<div class="nav-bar">
  <mat-toolbar color="primary">
    <span>Movie Management System</span>
    <span class="spacer"></span>
    <button mat-button routerLink="/movie" routerLinkActive="active">Movie List</button>
    <button mat-button routerLink="/modify-movie" routerLinkActive="active">Modify Movie</button>
  </mat-toolbar>
</div>

<!-- Main Container -->
<div class="app-container">
  <!-- Display Current Date -->
  <h1>{{ myDate | date: 'short' }}</h1>

  <!-- Display Title -->
  <h1>{{ title | uppercase }}</h1>

  <!-- Movie Section Toolbar -->
  <mat-toolbar>
    <span>Movies</span>
    <button mat-button routerLink="/movies" routerLinkActive="active">Movie List</button>
  </mat-toolbar>

  <!-- Dynamic Title for Movies Section -->
  <h2>{{ title }}</h2>

  <!-- Router Outlet for Dynamic Component Loading -->
  <router-outlet></router-outlet>
</div>
